name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: gitleaks (secrets in files and history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck libxml2-utils jq

      - name: shellcheck
        run: shellcheck -S warning -x steward.sh tests/*.sh

      - name: Quick tests (syntax, plugin sync, hook cases, auto-update scenarios)
        run: bash tests/run-all.sh --quick

      - name: Release rules (version bump, changelog, release branch flow, fixed update URL)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash tests/release-check.sh origin/main "$BASE_REF" "$HEAD_REF"
